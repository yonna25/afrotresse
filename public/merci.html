<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement réussi</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1E1008;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 360px;
      width: 100%;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      color: #C29036;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #C29036, #8B4513);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(194,144,54,0.15);
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">🎉</div>

    <h1>Paiement réussi !</h1>

    <p>
      Ton pack a été activé. Tu peux maintenant voir ton solde mis à jour.
    </p>

    <button class="btn" onclick="goToProfile()">
      Voir mon solde →
    </button>
  </div>

  <script>
    function goToProfile() {
      window.parent.postMessage({ type: "PAYMENT_SUCCESS" }, "*");
    }
  </script>
</body>
</html>
