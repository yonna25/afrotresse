<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement reçu</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1E1008;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      color: #C29036;
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="icon">✅</div>

  <h1>Paiement reçu !</h1>

  <p>
    Tes crédits sont en cours d'activation.<br/>
    Tu peux fermer cette fenêtre.
  </p>

  <!-- FIX IMPORTANT : signal vers l'app React -->
  <script>
    window.parent.postMessage(
      { type: "PAYMENT_SUCCESS" },
      "*"
    );
  </script>
</body>
</html>
